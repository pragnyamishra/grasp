[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grasp-review"
version = "0.1.0"
description = "A reviewer's assistant for pull requests. Understand and triage a change before you merge it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grasp = "grasp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["grasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
